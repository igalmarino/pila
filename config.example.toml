# Pila configuration. Copy to ~/.config/pila/config.toml (or
# $XDG_CONFIG_HOME/pila/config.toml, or pass --config FILE) and edit.
# Every setting is optional, and every one here is commented out: as it is,
# this file gives the same desktop as no file at all. Values marked
# "(default)" are what Pila uses when the setting is unset; the others are
# examples. Take the `#` off a line to use it: table headers ([keyboard],
# [bindings], ...) are left active so it lands in the right table.
# PILA_MOD, PILA_TERMINAL and PILA_LAUNCHER override the matching settings.
# An invalid file is reported in the log and in a notification, and Pila starts
# with the defaults.
# Saved changes apply right away (except autostart); if the edited file is
# invalid, Pila keeps the running config and says why in a notification.
# `pila --check-config` checks the file (keymap included) without starting.

# The modifier in "Mod+..." bindings and for Mod+drag (Mod+left drag moves a
# window, Mod+right drag resizes it from the nearest corner): alt, super or
# ctrl. Unset, it's super on a TTY and alt nested (a host desktop such as
# GNOME grabs Super while Pila runs inside it).
# mod = "super"                  # (default on a TTY; alt nested)

# Mod+Return, and what starts when there's no autostart. Unset, the first
# installed of kitty, foot, alacritty, ghostty, wezterm, konsole,
# gnome-terminal and xterm.
# terminal = "foot"                # e.g.

# Mod+D and tapping Mod alone. Unset, they do nothing.
# launcher = "fuzzel"              # e.g.

# Commands run at startup instead of the terminal (`pila -c` overrides them).
# They start once Xwayland is ready, so X11 apps work too. Unset, the terminal.
# autostart = [                    # e.g.
#     "swaybg -c 333355",
#     "waybar",
#     "mako",
#     "kitty",
# ]

# How many workspaces (virtual desktops) there are, 1 to 32. They span all
# screens; Mod+1..N goes to one, Mod+Shift+1..N moves the window there.
# workspaces = 4                   # (default)

# Rounded window corners: the radius in logical pixels, 0 (square) to 64.
# Maximized and fullscreen windows stay square. The radius is at most half
# the window's shorter side, and with a title bar at most the bar's height (28).
# corner-radius = 0                # (default)

# Monitors on the seat's other GPUs (a laptop's HDMI or DisplayPort wired to
# its dedicated GPU, a dock with a GPU of its own): drawn with the main GPU
# and copied to theirs. Off by default while it's new: untried on real
# hardware. Turned on or off as soon as the file is saved.
# other-gpus = false               # (default)

# A window that is all a monitor shows (a fullscreen video or game, with
# nothing over it) goes to the screen as its app drew it, and Pila draws
# nothing: less work for the GPU. On a TTY, on the main GPU's monitors. Turn
# it off if such a window flickers or shows wrong colors. Read as soon as the
# file is saved.
# direct-scanout = true            # (default)

# The shadow under each window, stronger for the focused one. None for a
# maximized or fullscreen window, or one whose app draws its own (past its
# geometry, as GTK's do); a window rule's `shadow` can say otherwise, except
# for a maximized or fullscreen window.
[shadow]
# enabled = true                   # (default)
# size = 24                        # (default) how far it reaches, in logical pixels: 0 to 64
# offset = [0, 6]                  # (default) right and down, -64 to 64
# color = "#00000066"              # (default) #rrggbb or #rrggbbaa
# inactive-color = "#00000033"     # (default) under the other windows

# The colors of what Pila draws, as #rrggbb. All of them are the defaults.
[colors]
# bar = "#2f3136"                  # title bar of the focused window
# bar-inactive = "#26272b"         # title bar of the others
# bar-urgent = "#8a5712"           # of one asking for attention
# icon = "#dfe1e5"                 # its title and buttons
# icon-inactive = "#80838a"
# hover = "#3f4249"                # a button under the pointer
# hover-icon = "#f2f3f5"
# close-hover = "#c42b1c"          # the close button under the pointer
# close-hover-icon = "#ffffff"
# background = "#1f2126"           # behind everything, without a wallpaper
# snap-preview = "#4477cc4d"       # where a dragged window would snap; #rrggbbaa too

# Short, subtle animations. `enabled = false` turns them all off; `speed`
# multiplies every duration (0.25 to 4: 2 is twice as slow). Each one takes
# its duration in ms (1 to 1000), or false to turn it off. All of them are
# the defaults.
[animations]
# enabled = true
# speed = 1.0
# window-open = 200                # rise and fade in
# window-close = 180               # shrink, drop and fade out
# minimize = 200                   # and restoring
# maximize = 220                   # also fullscreen and snapping
# layer = 150                      # launchers, notifications
# workspace = 250                  # slide sideways

# The keymap, passed to xkbcommon. Unset (or empty), xkbcommon's defaults or
# the XKB_DEFAULT_* variables. `localectl list-x11-keymap-layouts` (and
# -variants, -models, -options) lists the names where systemd is installed;
# `pila --check-config` says if xkbcommon can't build the keymap.
[keyboard]
# layout = "us,es"                 # e.g.: a list switches between them
# variant = ",dvorak"              # e.g.: one per layout
# model = "pc105"                  # e.g.: the keyboard's physical model
# options = "grp:alt_shift_toggle,caps:escape"   # e.g.
# repeat-delay = 200               # (default) ms before a held key repeats
# repeat-rate = 25                 # (default) repeats per second

# Touchpad and mouse (libinput, on a TTY; nested, the host handles input).
# Unset options keep libinput's defaults for the device, except tap, which
# Pila turns on. Options a device doesn't support are skipped.
[input.touchpad]
# tap = true                       # (default) tap to click
# natural-scroll = true            # e.g.: content follows the fingers
# accel-speed = 0.3                # e.g.: -1 (slowest) to 1 (fastest)
# accel-profile = "flat"           # e.g.: "adaptive" or "flat" (no acceleration)
# disable-while-typing = true      # e.g.: ignore the touchpad briefly while typing
# click-method = "clickfinger"     # e.g.: 1/2/3 fingers = left/right/middle; or "button-areas"
# middle-emulation = true          # e.g.: left + right together = middle

# The same options as the touchpad's, for mice and trackballs.
[input.mouse]
# natural-scroll = true            # e.g.
# accel-speed = -0.5               # e.g.
# accel-profile = "flat"           # e.g.: no acceleration, as many players prefer
# middle-emulation = true          # e.g.

[bindings]
# Key bindings: add new ones, replace defaults, or remove them with "none".
# Modifiers: Mod, Shift, Ctrl, Alt, Super; they must match exactly. Keys are
# xkb keysym names (Return, Tab, q, F5, XF86AudioRaiseVolume, ...). A modifier
# alone ("Mod", "Super", "Alt", "Ctrl") is a tap: it runs when the key is
# released with no other key, click, scroll or gesture since it was pressed.
# Commands get PILA_OUTPUT, the name of the screen under the pointer (e.g.
# "spawn grim -o \"$PILA_OUTPUT\" ~/shot.png" captures just that screen).
# Actions: spawn <command>, terminal, launcher, close, cycle-focus (switch to
# the previous window; hold the modifiers and repeat for older ones),
# cycle-focus-back, minimize (Mod+Tab brings the window back), maximize,
# fullscreen, snap-left, snap-right, snap-top-left, snap-top-right,
# snap-bottom-left, snap-bottom-right, restore, move-left, move-right, move-up,
# move-down, grow-width, shrink-width, grow-height, shrink-height, center,
# toggle-always-on-top (above the others), toggle-all-workspaces,
# show-desktop (minimize the workspace's windows; again, bring them back),
# focus-output <next|prev>, move-to-output <next|prev>,
# workspace <n|next|prev> (go to a workspace; next/prev don't wrap around),
# move-to-workspace <n|next|prev> (move the window there; "workspace-next" and
# "move-to-workspace-prev" work too), switch-layout <n|next|prev> (the keyboard
# layout, among [keyboard]'s; next/prev wrap around), power-off-monitors
# (every display off until any input; the key or click that wakes them does
# nothing else), power-on-monitors, quit, none.
# Dragging a window to the left/right edge of a screen snaps it to that half,
# near a corner to that quarter; the top edge maximizes it.
#
# The defaults:
#   "Mod+Return"  = "terminal"
#   "Mod+D"       = "launcher"
#   "Mod"         = "launcher"         (tap Mod alone)
#   "Mod+Tab"     = "cycle-focus"
#   "Mod+J"       = "cycle-focus"
#   "Mod+Shift+Tab" = "cycle-focus-back"
#   "Alt+Tab"     = "cycle-focus"      (also with Mod set to super or ctrl,
#   "Alt+Shift+Tab" = "cycle-focus-back" as on other desktops)
#   "Mod+M"       = "maximize"
#   "Mod+N"       = "minimize"
#   "Mod+F"       = "fullscreen"
#   "Mod+Left"    = "snap-left"       (again: restore)
#   "Mod+Right"   = "snap-right"
#   "Mod+Up"      = "maximize"
#   "Mod+Down"    = "restore"         (undo a snap or maximize)
#   "Mod+Shift+Left/Right/Up/Down" = "move-left/right/up/down"   (40 px)
#   "Mod+Ctrl+Right" = "grow-width"   "Mod+Ctrl+Left" = "shrink-width"
#   "Mod+Ctrl+Down"  = "grow-height"  "Mod+Ctrl+Up"   = "shrink-height"
#   "Mod+C"       = "center"
#   "Mod+T"       = "toggle-always-on-top"
#   "Mod+P"       = "toggle-all-workspaces"
#   "Mod+H"       = "show-desktop"
#   "Mod+O"       = "focus-output next"
#   "Mod+Shift+O" = "move-to-output next"
#   "Mod+Shift+S" = "spawn grim -g \"$(slurp)\" - | wl-copy"   (a region to the clipboard)
#   "Mod+Ctrl+S"  = "spawn mkdir -p ~/Pictures && grim -o \"$PILA_OUTPUT\" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png"
#                   (the screen under the pointer to a file; it needs grim, and the one
#                   above grim, slurp and wl-clipboard)
#   "Mod+1" .. "Mod+N" = "workspace 1" .. "workspace N"
#   "Mod+Shift+1" .. "Mod+Shift+N" = "move-to-workspace 1" .. "move-to-workspace N"
#                   (N = workspaces, at most 9; the other digits reach the apps)
#   "Mod+Page_Down" = "workspace-next"   "Mod+Page_Up" = "workspace-prev"
#   "Mod+Shift+Page_Down" = "move-to-workspace-next"
#   "Mod+Shift+Page_Up"   = "move-to-workspace-prev"
#   "Mod+Shift+Q" = "close"
#   "Mod+Shift+E" = "quit"
#
# Examples:
# "Mod+Shift+Return" = "spawn kitty -e htop"
# "XF86AudioRaiseVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
# "XF86AudioLowerVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
# "XF86AudioMute" = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
# "Mod+J" = "none"

[gestures]
# Touchpad swipes Pila handles itself (on a TTY), as "swipe-<fingers>-<way>"
# with 3 to 5 fingers and left, right, up or down (the way the fingers move).
# Values are the same actions as [bindings]. Pila keeps every swipe with a
# finger count used here from the apps; other gestures (pinch, unused finger
# counts) reach them. Window switching steps once more for every further
# stretch of the same swipe and ends when the fingers lift.
#
# The defaults:
#   "swipe-3-left"  = "cycle-focus"
#   "swipe-3-right" = "cycle-focus-back"
#   "swipe-3-up"    = "maximize"
#   "swipe-3-down"  = "restore"
#   "swipe-4-left"  = "workspace-next"
#   "swipe-4-right" = "workspace-prev"
#
# Examples:
# "swipe-3-down" = "minimize"
# "swipe-4-up" = "snap-left"
# "swipe-4-down" = "snap-right"

# Monitors, matched by connector name (shown in the log as "output connected",
# e.g. eDP-1, DP-1, HDMI-A-1). Without an entry, a monitor uses its preferred
# mode at scale 1, unrotated, right of the others. Nested, the only output is
# "winit", and only its scale applies. Tools using wlr-output-management
# (wlr-randr, a shell's display settings) change these at runtime; editing a
# monitor's entry here puts the file back in charge of that monitor.
# A section names a connector or a monitor: its make and model ("LEN P27h-30"),
# for any monitor of that model on any connector, or with its serial too ("LEN
# P27h-30 ABC123"), for that one monitor. The most specific section wins, and
# only that one applies. wlr-randr lists them; `pila.log` has the make and model
# ("monitor"). Without an EDID a monitor only answers to its connector.
# The entries below are examples: take the `#` off a whole one, header included.
#
# [[output]]
# name = "eDP-1"
# scale = 1.25              # 0.5 to 8, may be fractional (in 1/120 steps); default 1
#
# [[output]]
# name = "DP-1"
# mode = "2560x1440@143.9"  # WIDTHxHEIGHT[@HZ]; the closest refresh is used
# position = [1536, 0]      # top-left in logical pixels (size / scale), each
#                           # within -1000000..1000000
# transform = "90"          # rotated a quarter turn counter-clockwise (a monitor
#                           # standing on its side): normal, 90, 180, 270, or
#                           # flipped, flipped-90, flipped-180, flipped-270
# adaptive-sync = true      # variable refresh rate, if the monitor supports it
# enabled = false           # leave the monitor off (no windows go there); a
#                           # built-in screen comes back if no other is left

# Window and layer rules. A window rule matches windows by `app-id` (the
# class of WM_CLASS for X11 apps), `title` and `tag` (the name an app gives a
# kind of window of its own, such as "settings"; few apps set one); a layer
# rule matches layer surfaces (panels, launchers, notifications) by
# `namespace`. `*` stands for
# any run of characters; a rule's matchers must all match, and a rule without
# any matches everything. Every matching rule applies, in order, a later one
# overriding an earlier one field by field. `RUST_LOG=pila=debug` logs each
# new window's app id ("mapping window") and layer surface's namespace ("new
# layer surface"). Rules are matched when a window or layer surface appears,
# again for all of them when this file is saved, and again for a window whose
# title or app id changes. The open-* properties, size, position,
# always-on-top and all-workspaces only apply when a window opens.
# The rules below are examples: take the `#` off a whole one, header included.
#
# [[window-rule]]
# app-id = "steam_app_*"           # games: no window animations
# animations = false               # or per animation: { open = false,
#                                  #   close = false, minimize = false,
#                                  #   maximize = false }
#
# [[window-rule]]
# app-id = "firefox"
# title = "*Picture-in-Picture*"
# animations = { open = false }
# size = [480, 270]                # logical pixels; the app may round it
# position = [20, 20]              # top-left (title bar included) from the
#                                  # top-left of the output's free area
#
# [[window-rule]]
# app-id = "kitty"
# title-bar = false                # Pila draws no title bar (the app neither)
# corner-radius = 12               # instead of the one above
# opacity = 0.95                   # 0.1 to 1, title bar included
#                                  # (only lowers what the app draws: a translucent
#                                  # terminal stays so with opacity = 1)
# blur = true                      # blur what's seen through it, title bar
#                                  # included (false: never; unset: where the
#                                  # app asks for it)
# shadow = false                   # (true: even if the app draws its own)
#
# [[window-rule]]
# app-id = "thunderbird"
# open-on-workspace = 3            # opens there, without switching to it
# open-maximized = true            # or open-fullscreen = true
# always-on-top = true             # above the others, from when it opens
# all-workspaces = true            # on every workspace, from when it opens
#
# # A layer surface's namespace: the `RUST_LOG` line above logs it; in Pila's
# # source, scripts/layer-namespaces lists those of what you run.
#
# [[layer-rule]]
# namespace = "noctalia-*"         # a shell that animates its own surfaces
# animations = false
#
# [[layer-rule]]
# namespace = "waybar"
# blur = true                      # blur behind all of it (false: never;
#                                  # unset: where the app asks for it)
