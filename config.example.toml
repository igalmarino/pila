# Pila configuration. Copy to ~/.config/pila/config.toml (or
# $XDG_CONFIG_HOME/pila/config.toml, or pass --config FILE) and edit.
#
# Every uncommented setting in this file is Pila's built-in default. Any option
# you omit from your own config falls back to its value here, so you can keep
# only the lines you want to override. Commented lines are examples (marked
# "e.g.") or machine-dependent settings (mod, terminal, keymap), placed above
# the active default they would replace; remove the `#` to enable one.
#
# Environment variables PILA_MOD, PILA_TERMINAL, and PILA_LAUNCHER override
# their matching settings. Changes reload automatically on save (except
# autostart). Invalid edits keep the active config and show a notification; an
# invalid file at startup falls back to defaults. Run `pila --check-config` to
# validate your config and XKB keymap without starting Pila.

# Modifier key for "Mod+..." bindings and Mod+drag (Mod+left drag moves a
# window; Mod+right drag resizes from the nearest corner): "alt", "super", or
# "ctrl". Defaults to "super" on a TTY and "alt" when nested (so host desktops
# like GNOME keep Super).
# mod = "super"                  # (default on a TTY; alt nested)

# Terminal launched by Mod+Return. When unset, Pila uses kitty, or falls back
# to the first installed of foot, alacritty, ghostty, wezterm, konsole,
# gnome-terminal, and xterm.
# terminal = "foot"                # e.g.

# App launcher for Mod+D and tapping Mod alone (set "" to disable). Any Wayland
# launcher works.
# launcher = "wofi --show drun"    # e.g.
launcher = "fuzzel"

# Commands run once at startup (`pila -c` replaces this list; [] runs nothing).
# X11 apps here trigger Xwayland automatically. No terminal opens at startup
# unless listed (press Mod+Return to open one).
#
# Defaults:
#   - swaybg: draws Pila's generated wallpaper in [colors]. For your own image,
#     use "swaybg -i ~/Pictures/wallpaper.jpg -m fill". Without swaybg, Pila
#     shows [colors] background.
#   - waybar: top bar on every monitor.
#   - mako: notification daemon.
#   - swayidle: locks with swaylock after 5 min idle and before sleep, and
#     powers off monitors after 10 min (any input wakes them; visible videos
#     inhibit idling). For monitor power-off without locking:
#     "swayidle -w timeout 600 'pila msg action power-off-monitors'".
#
# Missing programs from these four defaults are skipped quietly (install
# `pila-desktop` to get them all); missing programs in custom commands trigger
# a notification. Keep only one active `autostart` key.
# autostart = [                    # e.g.
#     "waybar",
#     "mako",
#     "swayidle -w timeout 300 'swaylock -f' timeout 600 'pila msg action power-off-monitors' before-sleep 'swaylock -f'",
#     "swaybg -i ~/Pictures/wallpaper.jpg -m fill",  # fill, fit, center, ...
#     "fcitx5 -d",                 # input method (Chinese, Japanese, Korean, ...)
#     "kitty",
# ]
autostart = [
    "swaybg",
    "waybar",
    "mako",
    "swayidle -w timeout 300 'swaylock -f' timeout 600 'pila msg action power-off-monitors' before-sleep 'swaylock -f'",
]

# Generate matching configs (using [colors] and the title bar font) in
# $XDG_RUNTIME_DIR/pila-tools for unmodified default commands (swaybg, waybar,
# mako, fuzzel, and swaylock in swayidle) whenever you don't have your own
# config for that tool. Nothing is written to ~/.config, so other sessions are
# unaffected. Copy a generated file to ~/.config to customize it, or set false
# to use each tool's upstream defaults.
tool-configs = true

# Number of workspaces (1 to 32). Workspaces span all monitors; Mod+1..N switch
# workspaces and Mod+Shift+1..N move the focused window.
workspaces = 4

# Rounded window corners: radius in logical pixels (0 = square, up to 64) and
# which corners to round ("top" to match GTK windows, or "all"). Maximized and
# fullscreen windows stay square (unless `gaps` is set), and apps that draw
# their own shadow and corners (such as GTK) are left to round themselves
# unless overridden by a window rule. Clamped to half the shorter side and (for
# server-side decorated windows) the 28 px title bar height.
# corner-radius = 0                # square, e.g.
# rounded-corners = "all"          # e.g.
corner-radius = 8
rounded-corners = "top"

# Outer and inner gaps (logical pixels, 0 to 128) around maximized and snapped
# windows. When non-zero, maximized windows keep their shadow and rounded
# corners; fullscreen windows still cover the entire monitor.
# gaps = 12                        # e.g.
gaps = 0

# Enable monitors wired to secondary GPUs (such as dGPU ports on hybrid laptops
# or DisplayLink/GPU docks). Rendered on the primary GPU and copied across.
# Experimental and off by default until tested on dual-GPU hardware; reloads on
# save.
other-gpus = false

# Direct scanout (bare metal, primary GPU): bypass compositing when a single
# fullscreen game or video covers an entire monitor, saving GPU work and
# battery. Set false if fullscreen windows flicker or show wrong colors;
# reloads on save.
direct-scanout = true

# Screen tearing (bare metal): allow fullscreen games with vsync off to present
# immediately for lower latency when nothing else changes on that monitor. Set
# false to always wait for vblank; reloads on save.
tearing = true

# Late rendering (bare metal): delay compositing each frame until just before
# the upcoming vblank so recent client commits and pointer motion land one
# refresh sooner. Adapts automatically to recent frame times and backs off if a
# frame misses; reloads on save.
render-late = true

# Set false to drop all built-in bindings and gestures so only those in your
# config apply (useful for custom schemes or greetd greeter sessions). In a
# copied starter config, remove individual lines instead. Ctrl+Alt+F1..F12 VT
# switching is always active.
default-bindings = true

# Environment variables passed to everything Pila starts (autostart, bindings,
# terminal, launcher). Use NAME = "value" to set, or NAME = false to unset.
# Changes apply to newly launched programs; on a TTY they are also exported to
# D-Bus and systemd --user. Pila-managed variables (WAYLAND_DISPLAY, DISPLAY,
# XAUTHORITY, XDG_CURRENT_DESKTOP, XDG_SESSION_TYPE, PILA_SOCKET, PILA_OUTPUT,
# plus XCURSOR_THEME/XCURSOR_SIZE when set in [cursor]) cannot be overridden.
# Defaults below prefer Wayland with Xwayland fallback; override or set false
# to drop any entry.
[environment]
# SDL_VIDEODRIVER = "wayland,x11"  # e.g.: SDL 2 (may break games with older bundled SDL)
# GDK_BACKEND = "wayland,x11"      # e.g.: GTK already defaults to Wayland
# LANGUAGE = "zh_CN:zh_Hans:zh"    # e.g.
# XMODIFIERS = "@im=fcitx"         # e.g.: fcitx5 in X11 apps (XIM)
# QT_QPA_PLATFORMTHEME = false     # e.g.: remove variable
QT_QPA_PLATFORM = "wayland;xcb"    # Qt: Wayland, falling back to X11
ELECTRON_OZONE_PLATFORM_HINT = "auto"  # Electron (VS Code, Discord, ...)
MOZ_ENABLE_WAYLAND = "1"           # older Firefox and Thunderbird
_JAVA_AWT_WM_NONREPARENTING = "1"  # fixes blank Java X11 windows

# Window drop shadows (darker under the focused window). Skipped for maximized
# windows (when gaps = 0), fullscreen windows, and apps that draw their own
# shadows (GTK); override per app with a window rule's `shadow` field.
[shadow]
enabled = true
size = 24                          # blur radius in logical pixels (0 to 64)
offset = [0, 6]                    # horizontal and vertical offset (-64 to 64)
color = "#00000066"                # focused window (#rrggbb or #rrggbbaa)
inactive-color = "#00000033"       # unfocused windows

# Colors used by Pila's title bars, switcher, overview, and panels (#rrggbb).
[colors]
bar = "#2f3136"                  # focused title bar
bar-inactive = "#26272b"         # unfocused title bar
bar-urgent = "#8a5712"           # urgent window title bar
icon = "#dfe1e5"                 # focused title text and buttons
icon-inactive = "#80838a"        # unfocused title text and buttons
hover = "#3f4249"                # hovered button background
hover-icon = "#f2f3f5"           # hovered button icon
close-hover = "#c42b1c"          # hovered close button background
close-hover-icon = "#ffffff"     # hovered close button icon
background = "#1f2126"           # solid fallback background (without swaybg)
snap-preview = "#4477cc4d"       # drag-snap overlay (supports #rrggbbaa)

# Short, subtle animations. Set `enabled = false` to disable all animations,
# or adjust `speed` (0.25 to 4.0; 2.0 = twice as slow). Individual animations
# accept a duration in ms (1 to 1000), false (off), or true (default duration).
[animations]
enabled = true
speed = 1.0
window-open = 200                # rise and fade in
window-close = 180               # shrink, drop, and fade out
minimize = 200                   # minimize and restore
maximize = 220                   # maximize, fullscreen, and snap
layer = 150                      # launchers and notifications
workspace = 250                  # horizontal workspace slide
overview = 250                   # windows glide to and from overview positions

# Cursor theme, size, and shake-to-find magnification (reloads on save).
# When unset, theme and size fall back to XCURSOR_THEME / XCURSOR_SIZE
# (defaults: "default" and 24). When set here, they are also exported to newly
# launched apps.
[cursor]
# theme = "Adwaita"                # e.g.: directory in ~/.icons or /usr/share/icons
# size = 32                        # e.g.: logical pixels (8 to 256)
shake-to-find = true             # temporarily enlarge cursor when shaken
shake-magnification = 3.0        # maximum scale factor (1.5 to 5.0)

# Overview settings (opened with `overview` / Mod+W).
[overview]
hot-corner = true                # push pointer into top-left corner to toggle (disabled over fullscreen)

# Xwayland starts on demand when the first X11 app connects. Set idle-timeout
# (1 to 3600 seconds) to shut it down after the last X11 client exits (note:
# resets xrdb/setxkbmap/xmodmap state). Set enabled = false for an X11-free
# session (no DISPLAY or XAUTHORITY). Reloads on save.
[xwayland]
# idle-timeout = 10                # e.g.
enabled = true

# XKB keyboard layout. When unset or empty, uses xkbcommon defaults or
# XKB_DEFAULT_* env vars. On systemd distros, `localectl list-x11-keymap-layouts`
# (and -variants, -models, -options) lists valid values; `pila --check-config`
# validates the keymap.
[keyboard]
# layout = "us,es"                 # e.g.: comma-separated layouts
# variant = ",dvorak"              # e.g.: one variant per layout
# model = "pc105"                  # e.g.: physical keyboard model
# options = "grp:alt_shift_toggle,caps:escape"   # e.g.
repeat-delay = 200               # ms before a held key begins repeating
repeat-rate = 25                 # repeats per second
numlock = false                  # enable Num Lock at startup and on keymap reload

# Input device settings (bare metal via libinput; nested mode uses host input).
# wheel-binding-cooldown: minimum ms (0 to 1000) between mouse-wheel binding
# triggers so a quick flick switches one workspace instead of several (0 = no
# cooldown).
[input]
wheel-binding-cooldown = 150

# Omitted device options keep libinput defaults; unsupported options are
# ignored.
[input.touchpad]
# natural-scroll = true            # e.g.: content follows finger direction
# accel-speed = 0.3                # e.g.: -1.0 (slowest) to 1.0 (fastest)
# accel-profile = "flat"           # e.g.: "adaptive" or "flat"
# disable-while-typing = true      # e.g.: ignore palm touches while typing
# click-method = "clickfinger"     # e.g.: "clickfinger" or "button-areas"
# middle-emulation = true          # e.g.: left + right click = middle click
tap = true                       # tap to click

# Same libinput options for mice and trackballs.
[input.mouse]
# natural-scroll = true            # e.g.
# accel-speed = -0.5               # e.g.
# accel-profile = "flat"           # e.g.: disable pointer acceleration
# middle-emulation = true          # e.g.

[bindings]
# Add, override, or remove bindings (set to "none" to unbind).
# Modifiers: Mod, Shift, Ctrl, Alt, Super (must match exactly).
# Keys: XKB keysym names (Return, Tab, q, F5, XF86AudioRaiseVolume, ...), or
# mouse wheel notches (WheelScrollUp, WheelScrollDown, WheelScrollLeft,
# WheelScrollRight; consumed by Pila, not forwarded to apps). A lone modifier
# ("Mod", "Super", "Alt", "Ctrl") triggers on tap-and-release if no other key,
# click, scroll, or gesture occurred while held.
#
# By default a binding runs once per press. Use { action = "...", repeat = true }
# to repeat while held (at [keyboard]'s repeat-delay/repeat-rate).
# `spawn` commands receive PILA_OUTPUT naming the monitor under the pointer
# (e.g. "spawn grim -o \"$PILA_OUTPUT\" ~/shot.png").
#
# Available actions:
#   spawn <command>, terminal, launcher, close,
#   cycle-focus, cycle-focus-back, minimize, maximize, fullscreen, restore,
#   snap-left, snap-right, snap-top, snap-bottom,
#   snap-top-left, snap-top-right, snap-bottom-left, snap-bottom-right,
#   snap <left|right|up|down> (step through halves, quarters, maximize, restore),
#   move-left, move-right, move-up, move-down,
#   grow-width, shrink-width, grow-height, shrink-height, center,
#   toggle-always-on-top, toggle-all-workspaces, show-desktop, show-shortcuts,
#   overview, overview <open|close>,
#   focus-output <next|prev>, move-to-output <next|prev>,
#   workspace <n|next|prev>, move-to-workspace <n|next|prev>
#   ("workspace-next", "workspace-prev", "move-to-workspace-next", and
#   "move-to-workspace-prev" also work; next/prev stop at the ends),
#   switch-layout <n|next|prev> (wraps around),
#   power-off-monitors, power-on-monitors, quit, none.
#
# Mouse snapping: drag a window to the left/right edge for a half, near a
# corner for a quarter, or to the top edge to maximize.
#
# Your config's bindings apply after defaults, overriding matching keys.
# Mod+1..N and Mod+Shift+1..N (up to `workspaces`, max 9) are also bound
# automatically; unused digits pass through to apps.
#
# Examples:
# "Mod+Shift+Return" = "spawn kitty -e htop"
# "XF86AudioPlay" = "none"         # pass key through to apps
# "Mod+J" = "none"                 # remove a default binding
# "Mod" = "none"                   # disable tapping Mod to open launcher
#
"Mod+Return" = "terminal"
"Mod+D" = "launcher"
"Mod" = "launcher"                 # tap Mod alone
"Mod+Tab" = "cycle-focus"
"Mod+J" = "cycle-focus"
"Mod+Shift+Tab" = "cycle-focus-back"
"Alt+Tab" = "cycle-focus"          # works regardless of `mod`
"Alt+Shift+Tab" = "cycle-focus-back"
"Mod+W" = "overview"
"Mod+M" = "maximize"
"Mod+N" = "minimize"
"Mod+F" = "fullscreen"
"Mod+Left" = "snap left"           # left half; combine with Mod+Up/Down for quarters
"Mod+Right" = "snap right"
"Mod+Up" = "snap up"               # floating -> maximize
"Mod+Down" = "snap down"           # maximized -> restore
"Mod+Shift+Left" = "move-left"     # 40 px
"Mod+Shift+Right" = "move-right"
"Mod+Shift+Up" = "move-up"
"Mod+Shift+Down" = "move-down"
"Mod+Ctrl+Right" = "grow-width"
"Mod+Ctrl+Left" = "shrink-width"
"Mod+Ctrl+Down" = "grow-height"
"Mod+Ctrl+Up" = "shrink-height"
"Mod+C" = "center"
"Mod+T" = "toggle-always-on-top"
"Mod+P" = "toggle-all-workspaces"
"Mod+H" = "show-desktop"
"Mod+O" = "focus-output next"
"Mod+Shift+O" = "move-to-output next"
# Region screenshot to clipboard (grim, slurp, wl-clipboard) and active monitor
# screenshot to ~/Pictures (grim). Replace with any screenshot tool you prefer.
"Mod+Shift+S" = "spawn grim -g \"$(slurp)\" - | wl-copy"
"Mod+Ctrl+S" = "spawn mkdir -p ~/Pictures && grim -o \"$PILA_OUTPUT\" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png"
# Volume (wpctl/WirePlumber, capped at 100%), brightness (brightnessctl, never
# fully dark), and media playback (playerctl). Missing tools do nothing.
# Swap for pactl (PulseAudio) or swayosd-client (on-screen display) if desired.
# "XF86AudioRaiseVolume" = { action = "spawn pactl set-sink-volume @DEFAULT_SINK@ +5%", repeat = true }  # e.g.
# "XF86AudioRaiseVolume" = { action = "spawn swayosd-client --output-volume raise", repeat = true }  # e.g.
"XF86AudioRaiseVolume" = { action = "spawn wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+", repeat = true }
"XF86AudioLowerVolume" = { action = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-", repeat = true }
"XF86AudioMute" = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"XF86AudioMicMute" = "spawn wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"
"XF86MonBrightnessUp" = { action = "spawn brightnessctl -q set 5%+", repeat = true }
"XF86MonBrightnessDown" = { action = "spawn brightnessctl -q -n set 5%-", repeat = true }
"XF86AudioPlay" = "spawn playerctl play-pause"
"XF86AudioPause" = "spawn playerctl play-pause"
"XF86AudioNext" = "spawn playerctl next"
"XF86AudioPrev" = "spawn playerctl previous"
"XF86AudioStop" = "spawn playerctl stop"
"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-prev"
"Mod+Shift+Page_Down" = "move-to-workspace-next"
"Mod+Shift+Page_Up" = "move-to-workspace-prev"
"Mod+WheelScrollDown" = "workspace-next"
"Mod+WheelScrollUp" = "workspace-prev"
"Mod+Shift+WheelScrollDown" = "move-to-workspace-next"
"Mod+Shift+WheelScrollUp" = "move-to-workspace-prev"
"Mod+Shift+Q" = "close"
"Mod+Shift+E" = "quit"
"Mod+Shift+slash" = "show-shortcuts"  # Mod+?

[gestures]
# Touchpad swipes (bare metal): "swipe-<fingers>-<direction>", where fingers is
# 3, 4, or 5 and direction is left, right, up, or down (finger movement
# direction). Values use the same actions as [bindings]. Any finger count bound
# here is intercepted by Pila; pinch gestures and unbound finger counts pass
# through to apps. Continuous window-switching swipes step again as you keep
# sliding and confirm when you lift your fingers.
#
# Examples:
# "swipe-3-down" = "minimize"
# "swipe-5-left" = "snap-left"
# "swipe-5-right" = "snap-right"
#
"swipe-3-left" = "cycle-focus"
"swipe-3-right" = "cycle-focus-back"
"swipe-3-up" = "maximize"
"swipe-3-down" = "restore"
"swipe-4-left" = "workspace-next"
"swipe-4-right" = "workspace-prev"
"swipe-4-up" = "overview open"
"swipe-4-down" = "overview close"

# Monitor configuration (`[[output]]`). Unconfigured monitors use their
# preferred mode at scale 1, unrotated, placed to the right of existing
# outputs. In nested mode, the single output is named "winit" (only `scale`
# applies). Runtime tools using wlr-output-management (such as wlr-randr)
# override these until you edit the monitor's section here.
#
# Match by connector name ("eDP-1", "DP-1", "HDMI-A-1"), by EDID make and model
# ("GSM 27GL850", matching that model on any port), or with serial number too
# ("GSM 27GL850 ABC123"). Only the single most specific matching section
# applies. Find names via `wlr-randr` or Pila's log. Monitors without EDID
# match by connector only.
#
# Examples (uncomment an entire block, including `[[output]]`):
#
# [[output]]
# name = "eDP-1"
# scale = 1.25              # 0.5 to 8.0, supports fractional 1/120 steps (default: 1)
#
# [[output]]
# name = "DP-1"
# mode = "2560x1440@143.9"  # WIDTHxHEIGHT[@HZ]; picks closest available refresh rate
# position = [1536, 0]      # top-left in logical pixels (size / scale), within -1000000..1000000
# transform = "90"          # counter-clockwise rotation: normal, 90, 180, 270,
#                           # flipped, flipped-90, flipped-180, flipped-270
# adaptive-sync = true      # enable VRR if supported by the monitor
# enabled = false           # disable output (built-in screen re-enables if no other remains)

# Window and layer rules.
# `[[window-rule]]` matches by `app-id` (WM_CLASS class for X11), `title`, and
# `tag` (xdg-toplevel-tag). `[[layer-rule]]` matches bars, launchers, and
# notifications by `namespace`. Wildcards (`*`) match any characters; all
# specified matchers must match (a rule with no matchers matches everything).
# Matching rules apply in order, with later rules overriding earlier fields.
#
# Find IDs with `pila msg windows` or `RUST_LOG=pila=debug` (logs "mapping
# window" and "new layer surface"). Rules re-evaluate on reload and when a
# window's title or app-id changes, except open-time properties (open-*, size,
# position, always-on-top, all-workspaces).
#
# Examples (uncomment an entire block, including the header):
#
# [[window-rule]]
# app-id = "steam_app_*"           # disable animations for Steam games
# animations = false               # or per type: { open = false, close = false,
#                                  #   minimize = false, maximize = false }
#
# [[window-rule]]
# app-id = "firefox"
# title = "*Picture-in-Picture*"
# animations = { open = false }
# size = [480, 270]                # logical pixels (1 to 16384); app may adjust
# position = [20, 20]              # top-left (including title bar) relative to output's usable area
#
# [[window-rule]]
# app-id = "kitty"
# title-bar = false                # hide server-side title bar (no client-side bar either)
# corner-radius = 12               # override global corner-radius
# opacity = 0.95                   # 0.1 to 1.0, including title bar
#                                  # (caps opacity; a translucent app stays translucent at 1.0)
# blur = true                      # blur behind window and title bar (false: disable;
#                                  # unset: honor app's ext-background-effect request)
# shadow = false                   # override [shadow] (true forces shadow even on CSD apps)
#
# [[window-rule]]
# app-id = "org.gnome.Nautilus"
# opacity = 0.9                    # applies to menus too
# popup-blur = true                # blur behind menus even if the app doesn't ask (uses menu
#                                  # shape when provided, as in GTK; false: disable;
#                                  # unset: honor popup requests unless blur = false)
# popup-corner-radius = 8          # corner radius for blurred menus without an explicit shape
#
# [[window-rule]]
# app-id = "thunderbird"
# open-on-workspace = 3            # open on workspace 3 without switching to it
# open-on-output = "eDP-1"         # target monitor (connector or "Make Model"), falls back to pointer's
# open-focused = false             # open without stealing keyboard focus
# open-maximized = true            # or open-fullscreen = true
# always-on-top = true             # keep above other windows on open
# all-workspaces = true            # show on every workspace on open
#
# [[window-rule]]
# app-id = "pila"                  # keep nested Pila out of the way during development
# open-on-output = "eDP-1"
# open-focused = false
#
# # Find layer namespaces with `RUST_LOG=pila=debug` or `scripts/layer-namespaces`.
#
# [[layer-rule]]
# namespace = "my-shell-*"         # desktop shell that animates its own panels
# animations = false
#
# [[layer-rule]]
# namespace = "waybar"
# blur = true                      # blur behind panel (false: disable; unset: honor app request)
