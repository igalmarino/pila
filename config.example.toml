# pila configuration. Copy to ~/.config/pila/config.toml (or
# $XDG_CONFIG_HOME/pila/config.toml, or pass --config FILE) and edit.
# Every setting is optional; what's shown here are the defaults or examples.
# PILA_MOD, PILA_TERMINAL and PILA_LAUNCHER override the matching settings.
# An invalid file is reported in the log and pila starts with the defaults.
# Saved changes apply right away (except autostart); if the edited file is
# invalid, pila keeps the running config and says why in a notification.

# The modifier in "Mod+..." bindings and for Mod+drag: alt, super or ctrl.
# Alt is the default because a host desktop grabs Super when pila runs nested;
# on a TTY, super is the usual choice.
mod = "alt"

# Mod+Return, and what starts when there's no autostart.
terminal = "foot"

# Mod+D. Without one, Mod+D does nothing.
# launcher = "fuzzel"

# Commands run at startup instead of the terminal (pila -c overrides them).
# They start once Xwayland is ready, so X11 apps work too.
# autostart = [
#     "swaybg -c 333355",
#     "waybar",
#     "mako",
#     "foot",
# ]

# Passed to xkbcommon; empty means its defaults (or XKB_DEFAULT_*).
[keyboard]
layout = ""             # e.g. "us,es"
variant = ""            # e.g. ",dvorak"
model = ""
# options = "grp:alt_shift_toggle,caps:escape"
repeat-delay = 200      # ms before a held key repeats
repeat-rate = 25        # repeats per second

# Touchpad and mouse (libinput, on a TTY; nested, the host handles input).
# Unset options keep libinput's defaults, except tap, which pila turns on.
[input.touchpad]
tap = true
# natural-scroll = true           # content follows the fingers
# accel-speed = 0.0               # -1 (slowest) to 1 (fastest)
# accel-profile = "adaptive"      # or "flat"
# disable-while-typing = true
# click-method = "clickfinger"    # 1/2/3 fingers = left/right/middle; or "button-areas"
# middle-emulation = false        # left + right together = middle

[input.mouse]
# natural-scroll = false
# accel-speed = 0.0
# accel-profile = "flat"
# middle-emulation = false

# Key bindings: add new ones, replace defaults, or remove them with "none".
# Modifiers: Mod, Shift, Ctrl, Alt, Super; they must match exactly. Keys are
# xkb keysym names (Return, Tab, q, F5, XF86AudioRaiseVolume, ...).
# Actions: spawn <command>, terminal, launcher, close, cycle-focus (switch to
# the previous window; hold the modifiers and repeat for older ones),
# cycle-focus-back, minimize (Mod+Tab brings the window back), maximize,
# fullscreen, snap-left, snap-right, restore, move-left/right/up/down,
# grow-width, shrink-width, grow-height, shrink-height, center, quit, none.
# Dragging a window to the left/right edge of a screen snaps it to that half;
# the top edge maximizes it.
#
# The defaults:
#   "Mod+Return"  = "terminal"
#   "Mod+D"       = "launcher"
#   "Mod+Tab"     = "cycle-focus"
#   "Mod+J"       = "cycle-focus"
#   "Mod+Shift+Tab" = "cycle-focus-back"
#   "Mod+M"       = "maximize"
#   "Mod+N"       = "minimize"
#   "Mod+F"       = "fullscreen"
#   "Mod+Left"    = "snap-left"       (again: restore)
#   "Mod+Right"   = "snap-right"
#   "Mod+Up"      = "maximize"
#   "Mod+Down"    = "restore"         (undo a snap or maximize)
#   "Mod+Shift+Left/Right/Up/Down" = "move-left/right/up/down"   (40 px)
#   "Mod+Ctrl+Right" = "grow-width"   "Mod+Ctrl+Left" = "shrink-width"
#   "Mod+Ctrl+Down"  = "grow-height"  "Mod+Ctrl+Up"   = "shrink-height"
#   "Mod+C"       = "center"
#   "Mod+Shift+Q" = "close"
#   "Mod+Shift+E" = "quit"
[bindings]
# "Mod+Shift+Return" = "spawn foot -e htop"
# "XF86AudioRaiseVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
# "XF86AudioLowerVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
# "XF86AudioMute" = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
# "Mod+J" = "none"

# Monitors, matched by connector name (shown in the log as "output connected",
# e.g. eDP-1, DP-1, HDMI-A-1). Without an entry, a monitor uses its preferred
# mode at scale 1, right of the others. Nested, the only output is "winit",
# and only its scale applies.
# [[output]]
# name = "eDP-1"
# scale = 1.25              # may be fractional (in 1/120 steps); default 1
#
# [[output]]
# name = "DP-1"
# mode = "2560x1440@143.9"  # WIDTHxHEIGHT[@HZ]; the closest refresh is used
# position = [1536, 0]      # top-left in logical pixels (size / scale)
