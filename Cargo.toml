[package]
name = "pila"
version = "0.2.0"
edition = "2021"
# The oldest Rust that builds pila (cosmic-text needs 1.89).
rust-version = "1.89"
readme = "README.md"
repository = "https://github.com/igalmarino/pila"
keywords = ["wayland", "compositor", "smithay", "desktop"]
categories = ["gui"]
description = "A stacking Wayland compositor built on Smithay"
license = "GPL-3.0-or-later"

[dependencies]
bitflags = "2"
# The same calloop Smithay uses, plus its signal source (clean exit on
# SIGINT/SIGTERM).
calloop = { version = "0.14", features = ["signals"] }
cosmic-text = "0.19"
# sigprocmask, to start programs with no signals blocked (`Pila::session_env`).
libc = "0.2"
# The config file (`config.rs`).
serde = { version = "1", features = ["derive"] }
# The headless backend's control socket (`test_control.rs`, `introspect.rs`).
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Connector scanning for the DRM backend; same source as the copy in Smithay
# v0.7.0's tree. Its EDID support (`display-info`) is off: it binds
# libdisplay-info 0.1/0.2 and current distros ship 0.3, so monitors show as
# "Unknown".
smithay-drm-extras = { version = "0.1", default-features = false }
# Named cursors on bare metal (the nested host draws its own).
xcursor = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    # DRM/KMS backend (`udev.rs`)
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    # X11 apps (`xwayland.rs`)
    "xwayland",
]

# Integration tests (`tests/`): synthetic Wayland clients driving a headless
# pila (`--backend headless`).
[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# X11 test clients (`tests/x11.rs`), through pila's Xwayland.
x11rb = "0.13"
