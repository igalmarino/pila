[package]
name = "pila"
version = "0.9.6"
edition = "2021"
# The oldest Rust that builds pila (cosmic-text needs 1.89).
rust-version = "1.89"
readme = "README.md"
repository = "https://github.com/igalmarino/pila"
keywords = ["wayland", "compositor", "smithay", "desktop"]
categories = ["gui"]
description = "A stacking Wayland compositor built on Smithay"
license = "GPL-3.0-or-later"

[dependencies]
bitflags = "2"
# The same calloop Smithay uses, plus its signal source (clean exit on
# SIGINT/SIGTERM).
calloop = { version = "0.14", features = ["signals"] }
cosmic-text = "0.19"
# Gamma tables as GAMMA_LUT blobs (`udev/gamma.rs`): `drm` only makes blobs of
# fixed-size types. The version Smithay's `drm` uses.
drm-ffi = "0.9"
# sigprocmask, to start programs with no signals blocked (`Pila::session_env`).
libc = "0.2"
# Pila's default wallpaper, drawn in `[colors]` and handed to swaybg
# (`wallpaper.rs`): pure Rust, so no new system library.
png = "0.18"
# The config file (`config.rs`).
serde = { version = "1", features = ["derive"] }
# `pila msg` (`ipc.rs`) and the headless backend's control socket (`test_control.rs`).
serde_json = "1"
# Bindings of xdg-session-management-v1 (`session_protocol.rs`), until a
# wayland-protocols release has them.
wayland-scanner = "0.31"
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Connector scanning for the DRM backend; same source as the copy in Smithay's
# tree. Its EDID support (`display-info`) is off: it binds
# libdisplay-info 0.1/0.2 and current distros ship 0.3. `edid.rs` reads what
# pila needs.
smithay-drm-extras = { version = "0.1", default-features = false }
# Named cursors on bare metal (the nested host draws its own).
xcursor = "0.3"
tracing = "0.1"
# An X client of Pila's own, asking Xwayland which clients are left before
# stopping it (`xwayland.rs`, `[xwayland] idle-timeout`); the X11 test
# clients (`tests/x11.rs`) use it too. Smithay's version, with the same
# features, so it adds nothing to the build.
x11rb = { version = "0.14", features = ["res"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Desktop notifications over D-Bus (`notifications.rs`), on a thread of
# their own: pure Rust, so no notify-send and no new system library.
zbus = "6"
# Screen sharing through the portal Pila serves (`screencast.rs`): its
# streams are PipeWire nodes. Links libpipewire-0.3 (package pipewire).
pipewire = "0.10"

# Smithay's main branch, as niri and cosmic-comp use it: fixes reach pila
# without waiting for a release (0.7.0 is from June 2025). Move `rev` forward
# on purpose, with a full test run and a bare-metal check.
#
# From Pila's fork for now, branch `pila`: Smithay's 33323a91 (2026-11-16) plus
# what it lacks, each kept until Smithay has it:
# - a text cursor with no width (GTK's) is kept, so input methods' candidate
#   windows go next to it
#   (`input_method::a_text_cursor_with_no_width_places_the_candidate_window`
#   fails without);
# - asynchronous page flips, Smithay's pull request #1948 rebased (tearing,
#   `tearing.rs`: Pila doesn't build without its `PresentationMode`; the flips
#   themselves are bare metal's, `scripts/check` with vkcube);
# - an X display reserved apart from starting Xwayland, and an `X11Wm` that
#   removes its event sources when dropped: Smithay's pull request #2269
#   without its selection part (Xwayland on demand, `xwayland.rs`: Pila
#   doesn't build without `XWaylandDisplay`;
#   `x11::xwayland_stops_when_idle_if_asked` fails on the leaked sources);
# - shm buffers uploaded to their textures in strips of at most 128 KiB: a
#   whole 1920x1080 buffer in one call took radeonsi's slow path, 10 to 22 ms
#   of the event loop (`scripts/check`'s shm copies within 8 ms each fails
#   without, on bare metal);
# - `XdgForeignState::exported_surface`: the surface exported as a handle, so
#   the share picker names an app without an app id by the window it asks
#   from (`portal::an_app_without_an_app_id_is_named_by_its_window` doesn't
#   build without).
# On a bump: tag the rev `main` pins (`rev-<sha>`: released versions pin older
# ones, kept by their tags), rebase that branch on the new rev, or go back to
# `https://github.com/Smithay/smithay.git` once it has them.
[dependencies.smithay]
git = "https://github.com/igalmarino/smithay.git"
rev = "afdce3200fd6df7a71ed7ad9d6f8e68237b18920"
default-features = false
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    # DRM/KMS backend (`udev/`)
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    # GpuManager and MultiRenderer: monitors on more than one GPU
    # (`docs/MULTI_GPU.md`)
    "renderer_multi",
    # X11 apps (`xwayland.rs`)
    "xwayland",
]

# Integration tests (`tests/`): synthetic Wayland clients driving a headless
# pila (`--backend headless`).
[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# XFixes: the tests' X11 client hides its cursor, as games do.
x11rb = { version = "0.14", features = ["xfixes"] }



# No `[profile.release]`: LTO measured on 2026-11-16 (`scripts/check --nested`, three runs
# each) gave no gain with "thin" and about 3% less CPU per frame with "fat" and one codegen
# unit, for 2.3 times the clean build (184 s against 81) in every package build.

