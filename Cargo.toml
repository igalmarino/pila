[package]
name = "pila"
version = "0.4.1"
edition = "2021"
# The oldest Rust that builds pila (cosmic-text needs 1.89).
rust-version = "1.89"
readme = "README.md"
repository = "https://github.com/igalmarino/pila"
keywords = ["wayland", "compositor", "smithay", "desktop"]
categories = ["gui"]
description = "A stacking Wayland compositor built on Smithay"
license = "GPL-3.0-or-later"

[dependencies]
bitflags = "2"
# The same calloop Smithay uses, plus its signal source (clean exit on
# SIGINT/SIGTERM).
calloop = { version = "0.14", features = ["signals"] }
cosmic-text = "0.19"
# Gamma tables as GAMMA_LUT blobs (`udev/gamma.rs`): `drm` only makes blobs of
# fixed-size types. The version Smithay's `drm` uses.
drm-ffi = "0.9"
# sigprocmask, to start programs with no signals blocked (`Pila::session_env`).
libc = "0.2"
# The config file (`config.rs`).
serde = { version = "1", features = ["derive"] }
# `pila msg` (`ipc.rs`) and the headless backend's control socket (`test_control.rs`).
serde_json = "1"
# Bindings of xdg-session-management-v1 (`session_protocol.rs`), until a
# wayland-protocols release has them.
wayland-scanner = "0.31"
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Connector scanning for the DRM backend; same source as the copy in Smithay's
# tree. Its EDID support (`display-info`) is off: it binds
# libdisplay-info 0.1/0.2 and current distros ship 0.3. `edid.rs` reads what
# pila needs.
smithay-drm-extras = { version = "0.1", default-features = false }
# Named cursors on bare metal (the nested host draws its own).
xcursor = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Smithay's main branch, as niri and cosmic-comp use it: fixes reach pila
# without waiting for a release (0.7.0 is from June 2025). Move `rev` forward
# on purpose, with a full test run and a bare-metal check.
[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "65aa86fa5236e41775c313408102a5d5c2d1e2ca"
default-features = false
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    # DRM/KMS backend (`udev/`)
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    # X11 apps (`xwayland.rs`)
    "xwayland",
]

# Integration tests (`tests/`): synthetic Wayland clients driving a headless
# pila (`--backend headless`).
[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# X11 test clients (`tests/x11.rs`), through pila's Xwayland.
x11rb = "0.13"
