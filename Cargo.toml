[package]
name = "pila"
version = "0.1.0"
edition = "2021"
description = "A stacking Wayland compositor built on Smithay"
license = "MIT"

[dependencies]
bitflags = "2"
cosmic-text = "0.19"
# Connector scanning for the DRM backend; same source as the copy in Smithay
# v0.7.0's tree. Its EDID support (`display-info`) is off: it binds
# libdisplay-info 0.1/0.2 and Arch ships 0.3, so monitors show as "Unknown".
smithay-drm-extras = { version = "0.1", default-features = false }
# Named cursors on bare metal (the nested host draws its own).
xcursor = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    # DRM/KMS backend (`udev.rs`)
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
]
