name: Bug report
description: Something doesn't work, looks wrong, or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pila version
      description: Output of `pila --version` (or the git commit for a source build).
      placeholder: pila 0.9.4 (v0.9.4)
    validations:
      required: true
  - type: dropdown
    id: started
    attributes:
      label: How Pila was started
      options:
        - Login session (display manager)
        - Manually on a TTY (scripts/tty or pila)
        - Nested inside another desktop
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distro, GPU, and driver
      description: For example, "Fedora 44, Intel Iris Xe (i915)". `pila-report` detects the GPU and driver automatically.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Run `pila-report` (or `scripts/report` from a source checkout) to gather system info and logs into a file you can attach.
        Log locations:
        - Login session: `~/.local/state/pila/pila.log` (`pila.log.old` is the previous run; on systemd, also `journalctl -t pila -b`).
        - `scripts/tty`: `pila-tty.log`.
        - Nested: terminal output.
        Set `RUST_LOG=debug` for more detail. After a crash, include the "pila crashed" line and the backtrace that follows.
        Review the file before posting: logs can contain window titles, commands, and file paths.
      render: text
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Your `~/.config/pila/config.toml`, if you have one.
      render: toml
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Involved apps or desktop tools (bar, launcher, shell), monitor setup, or screenshots.
