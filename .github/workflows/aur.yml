# Publish pila-git to the AUR when its PKGBUILD or .SRCINFO change on main. The
# aur environment holds the SSH key (AUR_SSH_KEY), only for main, and waits for
# the maintainer's approval: users run what this publishes. Run by hand, it
# publishes whatever differs, and with nothing new it still tests the key.
name: AUR

on:
  push:
    branches: [main]
    paths:
      - packaging/aur/pila-git/PKGBUILD
      - packaging/aur/pila-git/.SRCINFO
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: .SRCINFO matches the PKGBUILD
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Packages
        run: pacman -Syu --noconfirm --needed base-devel git
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # makepkg doesn't run as root.
      - name: Compare
        run: |
          useradd --create-home builder
          cp packaging/aur/pila-git/PKGBUILD /home/builder/
          chown builder /home/builder/PKGBUILD
          cd /home/builder
          runuser -u builder -- makepkg --printsrcinfo > generated
          diff "$GITHUB_WORKSPACE/packaging/aur/pila-git/.SRCINFO" generated

  publish:
    name: Publish
    needs: check
    runs-on: ubuntu-latest
    environment: aur
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: SSH
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          # The fingerprint on aur.archlinux.org's home page:
          # SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > ~/.ssh/aur_known_hosts
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/aur_known_hosts" \
            >> "$GITHUB_ENV"
      - name: Push
        run: |
          git clone ssh://aur@aur.archlinux.org/pila-git.git aur
          cp packaging/aur/pila-git/PKGBUILD packaging/aur/pila-git/.SRCINFO aur/
          cd aur
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR already has this."
            exit 0
          fi
          version="$(sed -n 's/^\tpkgver = //p' .SRCINFO)"
          git -c user.name="Ignacio Galmarino" \
            -c user.email="igalmarino@users.noreply.github.com" \
            commit -m "Update to $version"
          git push origin HEAD:master
