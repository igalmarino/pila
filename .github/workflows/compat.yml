# What rarely breaks but must not stay broken: pila on other distros with the
# packages docs/INSTALL.md lists, the minimum Rust version, the Nix package and the
# RustSec advisories. pila-git and the flake build the latest main, so this
# doesn't wait for a release: it runs when something it depends on changes,
# every week (distros' images and advisories change without a commit), and by
# hand before a release (gh workflow run compat.yml).
name: Compatibility

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - package.nix
      - flake.nix
      - flake.lock
      - scripts/install
      - scripts/install-paths
      - resources/**
      - .github/workflows/compat.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - package.nix
      - flake.nix
      - flake.lock
      - scripts/install
      - scripts/install-paths
      - resources/**
      - .github/workflows/compat.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Read-only: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Packages
        run: |
          pacman -Syu --noconfirm --needed git rustup gcc clang pkgconf \
            seatd libinput systemd-libs mesa libxkbcommon libpipewire
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Toolchain from rust-version
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            . -> target
      - run: cargo build --locked

  distros:
    name: Build on ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The package lists from docs/INSTALL.md's build table, plus a C compiler
          # and curl for rustup.
          - image: debian:trixie
            install: >-
              apt-get update && apt-get install -y --no-install-recommends
              build-essential curl ca-certificates git
              libseat-dev libinput-dev libudev-dev libgbm-dev libxkbcommon-dev
              libpipewire-0.3-dev libclang-dev
              libegl1 xwayland pkg-config
          - image: ubuntu:24.04
            install: >-
              apt-get update && apt-get install -y --no-install-recommends
              build-essential curl ca-certificates git
              libseat-dev libinput-dev libudev-dev libgbm-dev libxkbcommon-dev
              libpipewire-0.3-dev libclang-dev
              libegl1 xwayland pkg-config
          - image: fedora:latest
            install: >-
              dnf install -y gcc curl git
              libseat-devel libinput-devel systemd-devel mesa-libgbm-devel
              libxkbcommon-devel pipewire-devel clang-devel
              mesa-libEGL xorg-x11-server-Xwayland
              pkgconf-pkg-config
    steps:
      - name: Packages
        run: ${{ matrix.install }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Rust (rustup, stable)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.image }}
          workspaces: |
            . -> target
      - run: cargo build --locked
      - run: ./target/debug/pila --version

  nix:
    name: Nix (package, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
      - run: nix flake check --no-build
      - run: nix build --print-build-logs
      - name: The package says which commit it is
        run: ./result/bin/pila --version | tee /dev/stderr | grep -F "$(git rev-parse --short=7 HEAD)"
      - run: ./result/bin/pila-report --help
      - run: ./result/bin/pila-check --help && test -f result/share/pila/check/capture-stream
      - run: nix develop --command cargo --version
      # The metapackage: Pila and the default configuration's tools.
      - run: nix build .#pila-desktop --out-link desktop --print-build-logs
      - run: for program in pila waybar fuzzel mako swayidle swaylock kitty wpctl; do test -x "desktop/bin/$program"; done
      # EGL's drivers, which a NixOS system provides, come from Mesa here. If
      # it starts, it's still running when its time is up. An X client
      # connecting starts the package's Xwayland (on demand), which refuses
      # its handshake without the cookie in XAUTHORITY and answers it with.
      - name: Smoke test
        run: |
          mesa="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#mesa)"
          cat >x11-client.py <<'EOF'
          import os, socket, struct


          def cookie():
              data = open(os.environ["XAUTHORITY"], "rb").read()
              at = 0

              def field():
                  nonlocal at
                  (size,) = struct.unpack(">H", data[at:at + 2])
                  value = data[at + 2:at + 2 + size]
                  at += 2 + size
                  return value

              while at < len(data):
                  at += 2
                  field(), field()
                  name, value = field(), field()
                  if name == b"MIT-MAGIC-COOKIE-1":
                      return name, value
              raise SystemExit("no cookie in XAUTHORITY")


          def handshake(name=b"", value=b""):
              conn = socket.socket(socket.AF_UNIX)
              conn.connect("/tmp/.X11-unix/X" + os.environ["DISPLAY"].lstrip(":"))
              pad = lambda b: b + b"\0" * (-len(b) % 4)
              conn.sendall(b"l\0" + struct.pack("<HHHH", 11, 0, len(name), len(value)) + b"\0\0"
                           + pad(name) + pad(value))
              conn.settimeout(4)
              return "accepted" if conn.recv(8)[:1] == b"\1" else "refused"


          print("X11 handshake without the cookie:", handshake())
          print("X11 handshake:", handshake(*cookie()))
          EOF
          status=0
          XDG_RUNTIME_DIR="$(mktemp -d)" PILA_HEADLESS_DEVICE=software \
            __EGL_VENDOR_LIBRARY_DIRS="$mesa/share/glvnd/egl_vendor.d" \
            timeout 5 ./result/bin/pila --backend headless -c "python3 $PWD/x11-client.py" \
            >pila.log 2>&1 || status=$?
          tail -n 20 pila.log
          test "$status" = 124
          grep -F 'Xwayland ready' pila.log
          grep -F 'X11 handshake without the cookie: refused' pila.log
          grep -F 'X11 handshake: accepted' pila.log

  audit:
    name: Dependencies (cargo audit)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Packages
        run: pacman -Syu --noconfirm --needed git rust cargo-audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cargo audit
