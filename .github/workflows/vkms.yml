# By hand only, an experiment: pila's DRM/KMS backend (`udev/`), which the
# test suite can't run, on vkms, the kernel's virtual KMS driver, loaded into
# the runner's own kernel (a VM): a session from seatd, the device opened,
# modesetting, vblank-paced frames and their statistics, a client drawing,
# without real hardware. It stops early, saying so, if the runner's kernel
# has no vkms module. Actions are pinned by commit, as in ci.yml.
name: KMS on vkms

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  vkms:
    name: udev backend on vkms
    runs-on: ubuntu-24.04
    steps:
      - name: Load vkms
        run: |
          sudo apt-get update
          # Where Ubuntu keeps the less common drivers, vkms among them.
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
          if ! sudo modprobe vkms enable_cursor=1; then
            echo "::error::the runner's kernel ($(uname -r)) has no vkms module"
            exit 1
          fi
          ls -l /dev/dri
      # README.md's build packages for Ubuntu, plus seatd to start the session,
      # Mesa's software drivers (vkms has no GPU to render with) and a client.
      - name: Packages
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libseat-dev libinput-dev libudev-dev libgbm-dev \
            libxkbcommon-dev libegl1 libegl-mesa0 libgl1-mesa-dri xwayland seatd weston
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release --locked
      # As root through seatd, as a TTY session would get the devices. It's
      # still running when its time is up: SIGTERM, which pila quits on,
      # logging its last frame statistics.
      - name: Run pila on vkms
        run: |
          runtime="$(mktemp -d)"
          chmod 700 "$runtime"
          status=0
          sudo env XDG_RUNTIME_DIR="$runtime" LIBSEAT_BACKEND=seatd \
            RUST_LOG=info,pila::frames=debug \
            seatd-launch -- timeout -s TERM 20 \
            target/release/pila --backend udev -c weston-simple-egl \
            >pila-vkms.log 2>&1 || status=$?
          tail -n 40 pila-vkms.log
          echo "exit status: $status"
          test "$status" = 124
      - name: Judge the log
        run: |
          fail=0
          check() {
            if grep -qE "$2" pila-vkms.log; then echo "PASS  $1"; else echo "FAIL  $1"; fail=1; fi
          }
          check "the session started" 'session started'
          check "the vkms device was opened" 'using GPU'
          check "an output came on" 'output connected'
          check "frames were drawn and measured" 'pila::frames: frames .*frames=[1-9]'
          check "the client connected" 'weston-simple-egl|app_id="weston-simple-egl"|mapping window'
          if grep -q 'panicked' pila-vkms.log; then echo "FAIL  no panic"; fail=1; else echo "PASS  no panic"; fi
          grep 'pila::frames: frames' pila-vkms.log || true
          exit "$fail"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pila-vkms-log
          path: pila-vkms.log
