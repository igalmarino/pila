# On every push: lint, test and build pila on Arch, and check the scripts. Other
# distros, the minimum Rust version, the Nix package and the advisories are in
# compat.yml. Actions are pinned by commit, so a moved tag can't change what
# runs here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Read-only: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  arch:
    name: Arch (fmt, clippy, test, staged install)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Packages
        run: |
          pacman -Syu --noconfirm --needed git rust gcc pkgconf \
            seatd libinput systemd-libs mesa libxkbcommon xorg-xwayland
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      # Unit and integration tests (tests/: headless pilas rendering on
      # Mesa's llvmpipe, X11 tests through Xwayland). A debug build: debug
      # assertions catch more.
      - run: cargo test --locked
      - run: target/release/pila --version
      - name: Staged install
        run: |
          DESTDIR="$RUNNER_TEMP/stage" PREFIX=/usr scripts/install --no-build
          find "$RUNNER_TEMP/stage" -type f | sort

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: shellcheck
        run: |
          shellcheck --severity=warning --external-sources \
            scripts/check scripts/coverage scripts/dev scripts/install scripts/layer-namespaces \
            scripts/link-wayland scripts/report scripts/screenshot scripts/shells scripts/tty \
            scripts/uninstall resources/session/pila-session \
            .devcontainer/post-start.sh
      - name: Python scripts
        run: |
          python3 -c 'import ast, sys; [ast.parse(open(f).read(), f) for f in sys.argv[1:]]' \
            scripts/sandbox-socket scripts/toplevel-action scripts/workspace-action \
            scripts/capture-stream
