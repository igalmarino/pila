# On every push: lint, test and build pila on Arch, and check the scripts. Other
# distros, the minimum Rust version, the Nix package and the advisories are in
# compat.yml. Actions are pinned by commit, so a moved tag can't change what
# runs here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Read-only: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  arch:
    name: Arch (fmt, clippy, test, staged install)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Packages
        # A font, as every desktop has: the tests that look at text drawn
        # (the shortcuts panel) need one; PILA_HEADLESS_NO_FONTS covers none.
        run: |
          pacman -Syu --noconfirm --needed git rust gcc clang pkgconf \
            seatd libinput systemd-libs mesa libxkbcommon libpipewire xorg-xwayland ttf-dejavu \
            pipewire
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      # Unit and integration tests (tests/: headless pilas rendering on
      # Mesa's llvmpipe, X11 tests through Xwayland). A debug build: debug
      # assertions catch more.
      - run: cargo test --locked
      - run: target/release/pila --version
      - name: Staged install
        run: |
          DESTDIR="$RUNNER_TEMP/stage" PREFIX=/usr scripts/install --no-build
          find "$RUNNER_TEMP/stage" -type f | sort
          grep -F 'ExecStart=/usr/bin/pila-session --service' \
            "$RUNNER_TEMP/stage/usr/lib/systemd/user/pila.service"
      # The .deb and .rpm built from that install as packages.yml builds them
      # at a release (nfpm's version and checksum kept in step with it): a
      # mistake in packaging/ shows here, not once a release is published.
      - name: Packages build
        env:
          NFPM_VERSION: 2.48.0
          NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          cp -r "$RUNNER_TEMP/stage" stage
          install -Dm644 -t stage/usr/share/doc/pila README.md config.example.toml docs/MANUAL.md docs/IPC.md
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          export VERSION
          for packager in deb rpm; do
            for config in packaging/nfpm.yaml packaging/nfpm-desktop.yaml; do
              "$RUNNER_TEMP/nfpm" package --config "$config" --packager "$packager" --target "$RUNNER_TEMP/"
            done
          done
          ls -l "$RUNNER_TEMP"/*.deb "$RUNNER_TEMP"/*.rpm
      # The AUR package built as its users build it, with makepkg's defaults
      # (its LTO flags too), from this commit rather than GitHub's main. makepkg
      # doesn't run as root; the dependencies are the Packages step's.
      - name: AUR package build
        run: |
          pacman -S --noconfirm --needed base-devel
          git branch -f ci-package HEAD
          useradd --create-home builder
          runuser -u builder -- git config --global --add safe.directory '*'
          dir=/home/builder/pila-git
          mkdir "$dir"
          sed "s|^source=.*|source=(\"pila::git+file://$GITHUB_WORKSPACE#branch=ci-package\")|" \
            packaging/aur/pila-git/PKGBUILD > "$dir/PKGBUILD"
          grep -q '^source=("pila::git+file://' "$dir/PKGBUILD"
          chown -R builder "$dir"
          (cd "$dir" && runuser -u builder -- makepkg --nodeps)
          ls -l "$dir"/*.pkg.tar.zst

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: shellcheck
        run: |
          shellcheck --severity=warning --external-sources \
            scripts/check scripts/coverage scripts/dev scripts/install scripts/layer-namespaces \
            scripts/link-wayland scripts/report scripts/tty scripts/demo-video \
            scripts/uninstall resources/session/pila-session \
            .devcontainer/post-start.sh
      - name: Python scripts
        run: |
          python3 -c 'import ast, sys; [ast.parse(open(f).read(), f) for f in sys.argv[1:]]' \
            scripts/sandbox-socket scripts/toplevel-action scripts/workspace-action \
            scripts/capture-stream scripts/apps scripts/demo-record scripts/demo-scenes
