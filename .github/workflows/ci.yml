# Lint, test and build pila, check the minimum Rust version, build it on
# other distros with the packages README.md lists, check the scripts and look
# up the dependencies in the RustSec advisory database, and build the Nix
# package. Actions are pinned by commit, so a moved tag can't change what runs
# here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Read-only: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  arch:
    name: Arch (fmt, clippy, test, staged install)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Packages
        run: |
          pacman -Syu --noconfirm --needed git rust gcc pkgconf \
            seatd libinput systemd-libs mesa libxkbcommon xorg-xwayland
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      # Unit and integration tests (tests/: headless pilas rendering on
      # Mesa's llvmpipe, X11 tests through Xwayland). A debug build: debug
      # assertions catch more.
      - run: cargo test --locked
      - run: target/release/pila --version
      - name: Staged install
        run: |
          DESTDIR="$RUNNER_TEMP/stage" PREFIX=/usr scripts/install --no-build
          find "$RUNNER_TEMP/stage" -type f | sort

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Packages
        run: |
          pacman -Syu --noconfirm --needed git rustup gcc pkgconf \
            seatd libinput systemd-libs mesa libxkbcommon
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Toolchain from rust-version
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --locked

  distros:
    name: Build on ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The package lists from README.md's build table, plus a C compiler
          # and curl for rustup.
          - image: debian:trixie
            install: >-
              apt-get update && apt-get install -y --no-install-recommends
              build-essential curl ca-certificates git
              libseat-dev libinput-dev libudev-dev libgbm-dev libxkbcommon-dev
              libegl1 xwayland pkg-config
          - image: ubuntu:24.04
            install: >-
              apt-get update && apt-get install -y --no-install-recommends
              build-essential curl ca-certificates git
              libseat-dev libinput-dev libudev-dev libgbm-dev libxkbcommon-dev
              libegl1 xwayland pkg-config
          - image: fedora:latest
            install: >-
              dnf install -y gcc curl git
              libseat-devel libinput-devel systemd-devel mesa-libgbm-devel
              libxkbcommon-devel mesa-libEGL xorg-x11-server-Xwayland
              pkgconf-pkg-config
    steps:
      - name: Packages
        run: ${{ matrix.install }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Rust (rustup, stable)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.image }}
      - run: cargo build --locked
      - run: ./target/debug/pila --version

  nix:
    name: Nix (package, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
      - run: nix flake check --no-build
      - run: cat flake.lock
      - run: nix build --print-build-logs
      - name: The package says which commit it is
        run: ./result/bin/pila --version | tee /dev/stderr | grep -F "$(git rev-parse --short=7 HEAD)"
      - run: ./result/bin/pila-report --help
      - run: nix develop --command cargo --version
      # EGL's drivers, which a NixOS system provides, come from Mesa here. If
      # it starts, it's still running when its time is up.
      - name: Smoke test
        run: |
          mesa="$(nix build --no-link --print-out-paths nixpkgs#mesa)"
          status=0
          XDG_RUNTIME_DIR="$(mktemp -d)" PILA_HEADLESS_DEVICE=software \
            __EGL_VENDOR_LIBRARY_DIRS="$mesa/share/glvnd/egl_vendor.d" \
            timeout 5 ./result/bin/pila --backend headless >pila.log 2>&1 || status=$?
          tail -n 20 pila.log
          test "$status" = 124
          grep -F 'Xwayland ready' pila.log

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: shellcheck
        run: |
          shellcheck --severity=warning --external-sources \
            scripts/coverage scripts/dev scripts/install scripts/layer-namespaces scripts/link-wayland \
            scripts/report scripts/tty \
            scripts/uninstall resources/session/pila-session \
            .devcontainer/post-start.sh .devcontainer/init-firewall.sh
      - name: Python scripts
        run: |
          python3 -c 'import ast, sys; [ast.parse(open(f).read(), f) for f in sys.argv[1:]]' \
            scripts/sandbox-socket scripts/toplevel-action scripts/workspace-action

  audit:
    name: Dependencies (cargo audit)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Packages
        run: pacman -Syu --noconfirm --needed git rust cargo-audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cargo audit
