# Noctalia settings for a pila session; scripts/install-config copies this to
# ~/.config/noctalia/config.toml (Noctalia merges every *.toml there over its
# defaults, and what its GUI changes goes to ~/.local/state/noctalia/
# settings.toml; the full list of options is in its example.toml). pila has no workspaces (and
# no ext-workspace), so the workspaces widget is left out of the bar;
# everything else Noctalia does on wlroots compositors works here too.

[bar.main]
start  = ["launcher", "wallpaper"]
center = ["clock"]
end    = ["media", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]
# Blur behind the bar (ext-background-effect) shows through wherever the bar
# is translucent (background_opacity below 1, or a capsule layout).
compositor_blur = true

[wallpaper]
enabled    = true
fill_color = "#1f2126"   # until a picture is picked (bar widget, or panel-toggle wallpaper)

# Lock after 5 minutes idle, screens off a minute later (back on with any input).
[idle.behavior.lock]
timeout = 300
action  = "lock"
enabled = true

# Noctalia's own screen_off action runs `wlr-randr --off` on compositors it
# doesn't know, which fails; wlopm (Arch: wlopm) goes through
# wlr-output-power-management instead.
[idle.behavior.screen-off]
timeout = 360
action  = "command"
command = "wlopm --off '*'"
resume_command = "wlopm --on '*'"
enabled = true

[lockscreen]
blurred_desktop = true
