# Noctalia settings for a pila session; scripts/install-config copies this to
# ~/.config/noctalia/settings.toml (Noctalia merges it over its defaults; the
# full list of options is in its example.toml). pila has no workspaces (and
# no ext-workspace), so the workspaces widget is left out of the bar;
# everything else Noctalia does on wlroots compositors works here too.

[bar.main]
start  = ["launcher", "wallpaper"]
center = ["clock"]
end    = ["media", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]
compositor_blur = true

[wallpaper]
enabled    = true
fill_color = "#1f2126"   # until a picture is picked (bar widget, or panel-toggle wallpaper)

# Lock after 5 minutes idle, screens off a minute later (back on with any input).
[idle.behavior.lock]
timeout = 300
action  = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 360
action  = "screen_off"
enabled = true

[lockscreen]
blurred_desktop = true
