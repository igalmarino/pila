# fuzzel for pila, matching the minimal waybar: the wallpaper color, light
# grey text, no extra chrome. Installed as ~/.config/pila/fuzzel.ini; the
# launcher binding runs fuzzel with it (see config.toml).

[main]
font=Adwaita Sans:size=11,Cantarell:size=11,DejaVu Sans:size=11,Symbols Nerd Font:size=11
prompt=""
placeholder=Search
icons-enabled=yes
width=36
lines=8
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=24
layer=overlay

[colors]
background=1f2126f2
text=dfe1e5ff
prompt=6c6f76ff
placeholder=6c6f76ff
input=dfe1e5ff
match=ffffffff
selection=2f3136ff
selection-text=ffffffff
selection-match=ffffffff
counter=6c6f76ff
border=2f3136ff

[border]
width=1
radius=8
