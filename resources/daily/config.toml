# A day-to-day pila session on a laptop with an external monitor, with
# Noctalia as the desktop shell (bar, launcher, notifications, wallpaper,
# lock screen, idle, OSDs, clipboard history). Install it with
# scripts/install-config (copies it to ~/.config/pila/config.toml and
# noctalia.toml to ~/.config/noctalia/config.toml, without overwriting),
# then edit to taste.
#
# Uses, from the Arch repos: noctalia ghostty wlopm.

mod = "super"
terminal = "ghostty"
launcher = "noctalia msg panel-toggle launcher"

autostart = [
    "noctalia",
    # In a login session (scripts/install) GDM's PAM setup starts and unlocks
    # the keyring that Chromium, VS Code and git's libsecret helper use. When
    # pila is started by hand (scripts/tty), start it here instead:
    # "gnome-keyring-daemon --start --components=secrets",
]

[keyboard]
layout = "us"
variant = "altgr-intl"

# Like GNOME's defaults: content follows the fingers, no taps while typing.
[input.touchpad]
tap = true
natural-scroll = true
disable-while-typing = true

[bindings]
# Switch windows with Alt+Tab too (Mod is Super here, so Super+Tab also works).
"Alt+Tab" = "cycle-focus"
"Alt+Shift+Tab" = "cycle-focus-back"
"Mod+L" = "spawn noctalia msg session lock"
"Mod+C" = "spawn noctalia msg panel-toggle control-center"
"Mod+V" = "spawn noctalia msg panel-toggle clipboard"
# Screenshots through Noctalia (region with its own selector, the screen
# under the pointer, the focused window); Print for keyboards that have it.
# pila's own defaults (Mod+Shift+S and Mod+Ctrl+S with grim) are replaced.
"Mod+Shift+S" = "spawn noctalia msg screenshot-region"
"Mod+Ctrl+S" = "spawn noctalia msg screenshot-fullscreen"
"Mod+Alt+S" = "spawn noctalia msg screenshot-window"
"Print" = "spawn noctalia msg screenshot-fullscreen"
"Shift+Print" = "spawn noctalia msg screenshot-region"
# Volume and brightness through Noctalia, which shows an OSD.
"XF86AudioRaiseVolume" = "spawn noctalia msg volume-up"
"XF86AudioLowerVolume" = "spawn noctalia msg volume-down"
"XF86AudioMute" = "spawn noctalia msg volume-mute"
"XF86AudioMicMute" = "spawn noctalia msg mic-mute"
"XF86MonBrightnessUp" = "spawn noctalia msg brightness-up"
"XF86MonBrightnessDown" = "spawn noctalia msg brightness-down"

# The laptop panel at 125 %, the external monitor at 100 % to its right
# (1536 = 1920 / 1.25). Without the monitor, the panel is the only output.
[[output]]
name = "eDP-1"
scale = 1.25

[[output]]
name = "DP-1"
position = [1536, 0]
