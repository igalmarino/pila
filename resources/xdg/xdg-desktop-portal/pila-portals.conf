# Which xdg-desktop-portal backends serve a pila session (XDG_CURRENT_DESKTOP=pila).
# Screen sharing goes through Pila itself (its own backend, pila.portal: it
# asks which screen to share and streams it over PipeWire); screenshots
# through xdg-desktop-portal-wlr, which uses pila's ext-image-copy-capture;
# everything else (file chooser, settings, ...) through xdg-desktop-portal-gtk.
#
# scripts/install puts this file in $SYSCONFDIR/xdg/xdg-desktop-portal/ (/etc
# by default) for a login session; scripts/tty copies it, with pila.portal, into the
# directory it points xdg-desktop-portal to (XDG_DESKTOP_PORTAL_DIR).
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=pila
org.freedesktop.impl.portal.Screenshot=wlr
