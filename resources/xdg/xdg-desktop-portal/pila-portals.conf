# Which xdg-desktop-portal backends serve a pila session (XDG_CURRENT_DESKTOP=pila).
# Screen sharing and screenshots go through xdg-desktop-portal-wlr, which uses
# pila's ext-image-copy-capture; everything else (file chooser, settings, ...)
# through xdg-desktop-portal-gtk.
#
# scripts/install puts this file in /etc/xdg/xdg-desktop-portal/ for a login
# session; scripts/tty points xdg-desktop-portal here through XDG_CONFIG_DIRS.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
